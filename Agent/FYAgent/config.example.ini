# FYAgent 配置示例（可提交到仓库；真实密钥请写到本机 config.ini，不要提交）
#
# 用法：把本文件复制为 Agent/FYAgent/config.ini，改成自己的接口地址 / 密钥 / 模型。
#       或者直接运行 python Agent\FYAgent\main.py —— 缺少 config.ini 时程序会自动生成一份同样内容的模板。
#
# DeepSeek 官方接口（OpenAI 兼容）参考值：
#   base_url    = https://api.deepseek.com/v1
#   model_name  = deepseek-chat（对话）或 deepseek-reasoner（推理）
#   api_key     = sk-<你自己的密钥>   （https://platform.deepseek.com/api_keys）
#
# 下面每一段的注释里写的就是该键的默认值；不需要的键可以直接删掉或留空。

[llm]
# 兼容 OpenAI 接口的地址
base_url = https://api.example.com/v1
# API 密钥（占位，必须替换）
api_key = sk-mock-replace-me
# 模型名称（占位，必须替换）
model_name = mock-model
# 单次请求超时（秒）
request_timeout = 60
# 单次回复的输出上限（含 Function Calling 的参数）
max_tokens = 4096
# 保留的上下文轮数：每轮 = 一次提问 + 一次回答
history_turns = 10
# 单轮内允许的连续工具调用轮数
max_tool_rounds = 40
# 同一工具 + 同一组参数连续调用多少次就判定为原地打转
max_repeated_tool_calls = 3
# System Prompt
system_prompt = 回答简洁，减少副词，不用 emoji。

[context]
# 模型上下文窗口（token）；0 = 自动探测，探测不到按 default_window 并标注「默认」
window = 0
default_window = 128000
# 达到窗口的这个比例就警告并暂停普通输入，等待 /compact
warn_ratio = 0.7
# 压缩摘要目标长度、压缩请求自身的输出上限与超时（秒）
compact_target_tokens = 5000
compact_max_tokens = 8192
compact_timeout = 300
# 压缩前原始上下文的归档目录（相对项目根）
archive_dir = .agents/context
# recallContext 单次检索返回的片段数与总字符上限
recall_max_snippets = 6
recall_max_chars = 3600

[session]
# 会话事件日志目录（/new、/resume、/save 使用）
dir = .agents/sessions
# 旧版 Markdown 历史目录；留空表示程序目录下的 chat_history
history_dir =
# 项目约定文件：存在时在会话首次加载注入一次，之后随历史复用
agents_md = AGENTS.md
agents_md_max_chars = 20000

[tools]
# 联网搜索（百度千帆智能搜索）与网页抓取
search_timeout = 30
search_top_k = 5
fetch_timeout = 30
fetch_max_chars = 20000
# 命令行工具：单次超时、允许的最大超时、单路输出上限
cli_timeout = 30
cli_max_timeout = 120
cli_max_output = 8000

[search]
# 百度千帆 API Key（留给 search 工具；没有就留空）
baidu_qianfan_api_key =
# 接口地址；留空用默认值
endpoint =

[mcp]
# MCP 配置文件路径；留空 = 技能目录下的 .mcp.json（缺失时自动生成模板）
config =
connect_timeout = 10
call_timeout = 30
max_output = 20000

[skills]
# 技能扫描根目录（分号分隔）；留空 = <启动目录>/.agents/skills
roots =

[plugins]
# 插件总开关（FYAgent 新增）；false 时不扫描、不装载任何插件
enabled = true
# 额外插件根目录（分号分隔）；留空 = <仓库根>/plugins
roots =
# 停用名单（分号分隔的插件名，大小写不敏感）；不需要删文件即可关闭某插件
disabled =

[ui]
# 主题（FYAgent 新增）：Textual 内置主题名，/theme 也可随时切换并写回这里
theme = textual-dark
# 右侧「服务与扩展」边栏：MCP / 插件 / 技能三组清单
sidebar = true
# 新工具卡片默认折叠成一行（也可在界面上 Ctrl+K 切换）
collapse_tools = false
# 顶栏时钟
clock = true
# 每条消息显示 HH:MM:SS 时间戳
timestamps = false