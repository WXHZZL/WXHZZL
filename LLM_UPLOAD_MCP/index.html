<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>AnythingLLM 文档上传</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body { font-family: system-ui, sans-serif; max-width: 600px; margin: 40px auto; padding: 0 20px; background: #f5f5f5; }
h1 { font-size: 20px; margin-bottom: 20px; color: #333; }
.card { background: #fff; border-radius: 8px; padding: 24px; box-shadow: 0 2px 8px rgba(0,0,0,0.1); }
label { display: block; font-size: 14px; color: #555; margin-bottom: 8px; }
input[type="file"] { width: 100%; padding: 10px; border: 2px dashed #ccc; border-radius: 6px; cursor: pointer; }
input[type="file"]:hover { border-color: #4a90d9; }
input[type="text"], input[type="password"] { width: 100%; padding: 10px; border: 1px solid #ccc; border-radius: 6px; font-size: 14px; }
input:focus { outline: 2px solid #4a90d9; outline-offset: -1px; }
.field { margin-bottom: 16px; }
.hint { font-size: 12px; color: #888; margin-top: 6px; line-height: 1.6; }
button { width: 100%; margin-top: 16px; padding: 12px; background: #4a90d9; color: #fff; border: none; border-radius: 6px; font-size: 16px; cursor: pointer; }
button:hover { background: #357abd; }
button:disabled { background: #aaa; cursor: not-allowed; }
#status { margin-top: 16px; font-size: 14px; line-height: 1.8; }
.ok { color: #27ae60; }
.err { color: #e74c3c; }
.info { color: #555; }
.file-list { margin-top: 12px; font-size: 13px; color: #666; }
</style>
</head>
<body>
<div class="card">
  <h1>AnythingLLM 文档上传</h1>
  <div class="field">
    <label for="apiInput">服务地址</label>
    <input type="text" id="apiInput" placeholder="http://localhost:3001/api/v1">
  </div>
  <div class="field">
    <label for="keyInput">API 密钥</label>
    <input type="password" id="keyInput" placeholder="AnythingLLM 的 API Key">
    <div class="hint">密钥只保存在这台机器的浏览器 localStorage 里，不会写进源码，也不会上传到任何地方。</div>
  </div>
  <label>选择文件</label>
  <input type="file" id="fileInput" multiple>
  <div class="file-list" id="fileList"></div>
  <button id="uploadBtn" disabled onclick="uploadAll()">上传并嵌入</button>
  <div id="status"></div>
</div>

<script>
// 连接参数从界面读取并记住在浏览器本地（localStorage）：
// 源码里不再写死任何密钥，这份 HTML 可以安全地提交到仓库。
const STORAGE_API = 'anythingllm.api';
const STORAGE_KEY = 'anythingllm.key';
const DEFAULT_API = 'http://localhost:3001/api/v1';

const apiInput = document.getElementById('apiInput');
const keyInput = document.getElementById('keyInput');
apiInput.value = localStorage.getItem(STORAGE_API) || DEFAULT_API;
keyInput.value = localStorage.getItem(STORAGE_KEY) || '';

function currentApi() {
  return (apiInput.value || DEFAULT_API).trim().replace(/\/+$/, '');
}

function currentKey() {
  return keyInput.value.trim();
}

function authHeaders(extra = {}) {
  return { 'Authorization': `Bearer ${currentKey()}`, ...extra };
}

apiInput.addEventListener('change', () => localStorage.setItem(STORAGE_API, currentApi()));
keyInput.addEventListener('change', () => localStorage.setItem(STORAGE_KEY, currentKey()));

const fileInput = document.getElementById('fileInput');
const uploadBtn = document.getElementById('uploadBtn');
const status = document.getElementById('status');
const fileList = document.getElementById('fileList');

fileInput.addEventListener('change', () => {
  const files = fileInput.files;
  uploadBtn.disabled = files.length === 0;
  fileList.textContent = files.length ? `已选择 ${files.length} 个文件` : '';
  status.innerHTML = '';
});

function log(msg, cls = 'info') {
  status.innerHTML += `<div class="${cls}">${msg}</div>`;
}

async function getWorkspaceSlug() {
  if (!currentKey()) throw new Error('请先填写 API 密钥');
  const resp = await fetch(`${currentApi()}/workspaces`, { headers: authHeaders() });
  const data = await resp.json();
  if (!data.workspaces?.length) throw new Error('无工作区');
  return data.workspaces[0].slug;
}

async function uploadFile(file) {
  const form = new FormData();
  form.append('file', file);
  const resp = await fetch(`${currentApi()}/document/upload`, {
    method: 'POST', headers: authHeaders(), body: form
  });
  const data = await resp.json();
  if (!data.success) throw new Error(data.error || '上传失败');
  return data.documents[0].location;
}

async function embedDoc(slug, location) {
  const resp = await fetch(`${currentApi()}/workspace/${slug}/update-embeddings`, {
    method: 'POST',
    headers: authHeaders({ 'Content-Type': 'application/json' }),
    body: JSON.stringify({ adds: [location], deletes: [] })
  });
  const data = await resp.json();
  if (!data.workspace) throw new Error('嵌入失败');
  return data;
}

async function uploadAll() {
  const files = fileInput.files;
  if (!files.length) return;
  uploadBtn.disabled = true;
  status.innerHTML = '';

  try {
    log('获取工作区...');
    const slug = await getWorkspaceSlug();
    log(`工作区: ${slug}`);

    for (const file of files) {
      log(`上传: ${file.name}...`);
      const location = await uploadFile(file);
      log(`✓ 上传完成 → ${location}`, 'ok');

      log(`嵌入: ${file.name}...`);
      await embedDoc(slug, location);
      log(`✓ 嵌入完成: ${file.name}`, 'ok');
    }

    log('全部完成!', 'ok');
  } catch (e) {
    log(`错误: ${e.message}`, 'err');
  } finally {
    uploadBtn.disabled = false;
  }
}
</script>
</body>
</html>
